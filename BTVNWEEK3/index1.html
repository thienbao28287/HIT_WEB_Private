<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <link rel="stylesheet" href="styles.css" />

  <body>
    <div class="main">

      <div class="content">
        <h1 class="one">Nguyễn Tiến Dũng</h1>
        <p class="two">Front-End Developer</p>
        <p class="three">
          Đam mê sáng tạo trải nghiệm web trực quan và tinh tế. Luôn hướng tới
          giao diện đẹp, gọn gàng và hiệu quả.
        </p>
      </div>
      <div class="socials">
        <a href="#"><i class="fa-brands fa-facebook"></i></a>
        <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
        <a href="#"><i class="fa-solid fa-envelope"></i></a>

    </div>
